name: Deploy Backend to Cloud Run

on:
  workflow_run:                                # starts deploy workflow after completion of the test workflow
    workflows: ["Tests"] 
    types:
      - completed
    branches:
      - main                                   # starts workflow on branch main only 
env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west10
  GAR_REPOSITORY: todoapp                      # name of the Artifact Registry repository
  SERVICE_NAME: todoapp-backend-service        # name of the deployed Cloud Run service

jobs:
  deploy:                                      # custom name
    runs-on: ubuntu-latest

    # deploy workflow should only start after successful completion of test workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:                               # access rights for the Github Actions Job in the Github environment 
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # ref ensures that the deploy workflow checks out the same commit as the test workflow
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/backend:${{ github.event.workflow_run.head_sha }}"
          docker build -t "$IMAGE_TAG" .
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"    
        # store the image tag in the environment variable IMAGE_TAG for later use

      - name: Push Docker image   
        run: |
          docker push "${{ env.IMAGE_TAG }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${{ env.IMAGE_TAG }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --port=8080 \
            --allow-unauthenticated \
            --set-env-vars DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
            --set-env-vars DATABASE="${{ secrets.DATABASE }}" \
            --set-env-vars FRONTEND_URL="${{ secrets.FRONTEND_URL }}"