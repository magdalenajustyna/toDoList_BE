name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - test/github_actions

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west10
  GAR_REPOSITORY: todoapp
  SERVICE_NAME: todoapp-backend-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions: # Rechte des Github Actions Job im Github Umfeld 
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_TAG }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${{ env.IMAGE_TAG }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --port=8080 \
            --set-env-vars DB_CONNECTION="${{ secrets.DB_CONNECTION }}" \
            --set-env-vars DATABASE="${{ secrets.DATABASE }}" \
            --set-env-vars FRONTEND_URL="${{ secrets.FRONTEND_URL }}"