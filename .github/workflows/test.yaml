name: Tests

on:
  push:
    branches:
      - main
      - test_workflow
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Unit Tests ausführen
        run: npx jest test/todos.test.js

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Integration Tests ausführen
        run: npx jest test/todos.integration.test.js --runInBand --detectOpenHandles

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      DB_CONNECTION: mongodb://127.0.0.1:27017/todolist_ci
    

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: E2E Tests ausführen
        run: >
          npx jest
          test/user-registration.e2e.test.js
          test/todo-management.e2e.test.js
          --runInBand
          --detectOpenHandles